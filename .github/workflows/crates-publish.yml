name: crates.io publish (reusable)

# Call on push of a v* tag from a public crate repo (hypr-paths, hypr-logind,
# hypr-ipc). Missing CARGO_REGISTRY_TOKEN fails the job. Do not cargo publish
# from a laptop.

on:
  workflow_call:
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: crates.io API token (org secret; cargo reads this env name)
        required: true

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    container: archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel rust git

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Trust the checkout (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Require crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is missing; set the org Actions secret."
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
