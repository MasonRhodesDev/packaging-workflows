name: Release (reusable)

# Call on push of a v* tag. Builds the Arch package, attaches it to the
# GitHub Release, submits COPR, and dispatches arch-repo. COPR and
# [mason] are required for rpm-enabled repos: missing COPR_CONFIG /
# COPR_WEBHOOK_URL or ARCH_REPO_TOKEN fails the release. COPR projects
# are created from CI when absent. rpm: false (e.g. deck-tenant) skips
# the COPR job only.

on:
  workflow_call:
    inputs:
      pkgbuild-dir:
        type: string
        default: packaging
      extra-repos:
        description: Extra pacman repo sections for the Arch build (see arch-package.yml)
        type: string
        default: ''
      extra-repo-key-url:
        description: HTTPS URL of the public key required by extra-repos
        type: string
        default: ''
      extra-repo-key-fingerprint:
        description: Full fingerprint expected from extra-repo-key-url
        type: string
        default: ''
      spec-name:
        description: Base name of the RPM spec and rpmlintrc under packaging/
        type: string
        default: ''
      rpm:
        description: Build and gate the Fedora package before publishing
        type: boolean
        default: true
      security:
        description: Run cargo-deny before publishing
        type: boolean
        default: false
      copr-project:
        description: "COPR project name (defaults to NAME in packaging/build-srpm.sh)"
        type: string
        default: ''
      copr-enable-net:
        description: copr-cli modify --enable-net on (needed when the RPM fetches crates)
        type: boolean
        default: false
      skip-head-snapshot:
        description: Pass through to arch-package.yml for packaging-only upstream sources
        type: boolean
        default: false
    secrets:
      COPR_CONFIG:
        description: Content of ~/.config/copr (copr-cli token file) — builds the SRPM in CI and submits it directly (optional; note the token expires ~180 days)
        required: false
      COPR_WEBHOOK_URL:
        description: COPR custom-webhook URL for this package (optional fallback when COPR_CONFIG is unset)
        required: false
      ARCH_REPO_TOKEN:
        description: Fine-grained PAT allowed to send repository_dispatch to arch-repo (optional)
        required: false

jobs:
  arch-package:
    uses: ./.github/workflows/arch-package.yml
    permissions:
      contents: write
    with:
      pkgbuild-dir: ${{ inputs.pkgbuild-dir }}
      publish: false
      extra-repos: ${{ inputs.extra-repos }}
      extra-repo-key-url: ${{ inputs.extra-repo-key-url }}
      extra-repo-key-fingerprint: ${{ inputs.extra-repo-key-fingerprint }}
      skip-head-snapshot: ${{ inputs.skip-head-snapshot }}

  rpm-check:
    if: inputs.rpm
    uses: ./.github/workflows/rpm-check.yml
    with:
      spec-name: ${{ inputs.spec-name }}

  security:
    if: inputs.security
    uses: ./.github/workflows/security.yml

  publish-release:
    name: Publish gated GitHub Release
    needs: [arch-package, rpm-check, security]
    if: >-
      always() &&
      needs.arch-package.result == 'success' &&
      (needs.rpm-check.result == 'success' || needs.rpm-check.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: arch-package
          path: dist
      - name: Publish package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This job has no checkout; pass -R so gh does not shell out to git.
          repo="${{ github.repository }}"
          if ! gh release view "$GITHUB_REF_NAME" -R "$repo" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" -R "$repo" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" -R "$repo" dist/*.pkg.tar.zst --clobber

  copr:
    name: Publish to COPR
    needs: publish-release
    if: inputs.rpm
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:42@sha256:e78cd1a688cd079c23864f289a89a49a3f4ad66d817864e325e1d058310ee95c
    steps:
      # Install git BEFORE checkout: in a container job actions/checkout
      # otherwise falls back to an API tarball (no .git, no tags) and
      # build-srpm.sh's tag gate fails with "not a git repository".
      - name: Install build tooling
        run: dnf -y install git-core copr-cli rpm-build rpmlint rust cargo curl-minimal
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Build SRPM and submit with copr-cli (or fall back to webhook)
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
          COPR_PROJECT: ${{ inputs.copr-project }}
          COPR_ENABLE_NET: ${{ inputs.copr-enable-net }}
        run: |
          set -euo pipefail
          if [ -z "$COPR_CONFIG" ] && [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::error::COPR_CONFIG or COPR_WEBHOOK_URL is required — a release must publish COPR"
            exit 1
          fi
          if [ -n "$COPR_CONFIG" ]; then
            git config --global --add safe.directory "$(pwd)"
            mkdir -p ~/.config
            printf '%s' "$COPR_CONFIG" > ~/.config/copr
            chmod 600 ~/.config/copr
            if [ -z "$COPR_PROJECT" ]; then
              COPR_PROJECT=$(sed -n 's/^NAME="\?\([^"]*\)"\?/\1/p' packaging/build-srpm.sh | head -1)
            fi
            if [ -z "$COPR_PROJECT" ]; then
              echo "::error::could not determine COPR project name"
              exit 1
            fi
            export COPR_PROJECT
            if ! copr-cli list-packages "$COPR_PROJECT" >/dev/null 2>&1; then
              echo "==> creating COPR project $COPR_PROJECT"
              copr-cli create "$COPR_PROJECT" \
                --chroot fedora-42-x86_64 \
                --chroot fedora-43-x86_64 \
                --chroot fedora-rawhide-x86_64
            fi
            if [ "$COPR_ENABLE_NET" = "true" ]; then
              copr-cli modify "$COPR_PROJECT" --enable-net on
            fi
            bash packaging/build-srpm.sh --copr
          else
            curl -fsS -X POST "$COPR_WEBHOOK_URL"
          fi

  update-arch-repo:
    name: Republish arch-repo
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch to MasonRhodesDev/arch-repo
        env:
          TOKEN: ${{ secrets.ARCH_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::ARCH_REPO_TOKEN is required — a release must republish [mason]"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/MasonRhodesDev/arch-repo/dispatches \
            -d '{"event_type":"package-released"}'
