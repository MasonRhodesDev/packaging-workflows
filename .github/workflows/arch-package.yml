name: Arch package (reusable)

on:
  workflow_call:
    inputs:
      pkgbuild-dir:
        description: Directory containing the PKGBUILD
        type: string
        default: packaging
      publish:
        description: Upload the built package to the GitHub Release for this tag
        type: boolean
        default: false
      extra-repos:
        description: >-
          Extra pacman repo sections appended to /etc/pacman.conf before
          dependency resolution, e.g. for depends that live in the [mason]
          repo. Newline-separated pacman.conf syntax.
        type: string
        default: ''
      extra-repo-key-url:
        description: HTTPS URL of the public key required by extra-repos
        type: string
        default: ''
      extra-repo-key-fingerprint:
        description: Full fingerprint expected from extra-repo-key-url
        type: string
        default: ''
      skip-head-snapshot:
        description: >-
          Do not replace PKGBUILD sources with a git-archive of this repo.
          Use for packaging-only repos whose source= is an upstream tarball.
        type: boolean
        default: false
      architectures:
        description: >-
          JSON array of architectures to consider. The PKGBUILD's own arch=()
          decides what is actually built, so adding aarch64 there is the only
          change a project needs; this input exists to withhold one anyway.
        type: string
        default: '["x86_64", "aarch64"]'

jobs:
  # The PKGBUILD's arch=() is the source of truth for which architectures a
  # package supports, so a project opts into aarch64 by editing one line there
  # rather than by also passing an input here. Intersecting the two means a
  # project still on arch=('x86_64') keeps building exactly one leg and its
  # release gate keeps passing, instead of acquiring a leg that cannot work.
  plan:
    name: Resolve architectures
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.resolve.outputs.architectures }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Inlined rather than a script file: actions/checkout in a reusable
      # workflow checks out the CALLER's repository, so a script committed
      # here would not be present in this working directory.
      - name: Intersect requested architectures with the PKGBUILD
        id: resolve
        env:
          REQUESTED: ${{ inputs.architectures }}
          PKGBUILD_DIR: ${{ inputs.pkgbuild-dir }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          requested = json.loads(os.environ["REQUESTED"])
          pkgbuild = os.path.join(os.environ["PKGBUILD_DIR"], "PKGBUILD")
          text = open(pkgbuild, encoding="utf-8").read()

          match = re.search(r"^arch=\(([^)]*)\)", text, re.MULTILINE)
          if not match:
              sys.exit(f"::error::no arch=() found in {pkgbuild}")
          declared = re.findall(r"[A-Za-z0-9_]+", match.group(1))

          # An arch=('any') package is architecture-independent: build it once.
          # arch-repo copies arch=any packages into every architecture's
          # database, so a second identical build would be wasted work.
          if "any" in declared:
              resolved = ["x86_64"]
          else:
              resolved = [a for a in requested if a in declared]

          if not resolved:
              sys.exit(
                  f"::error::none of the requested architectures {requested} "
                  f"are declared in {pkgbuild} (arch={declared})"
              )

          print(f"PKGBUILD declares {declared}; requested {requested}")
          print(f"building: {resolved}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"architectures={json.dumps(resolved)}\n")
          EOF

  makepkg:
    name: makepkg → namcap (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.architectures) }}
    # Arch publishes no official aarch64 image, so the ARM leg uses
    # menci/archlinuxarm (Arch Linux ARM, multi-arch, rebuilt daily), pinned by
    # digest exactly as the x86_64 leg pins the official image.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.arch == 'aarch64' && 'menci/archlinuxarm:base-devel@sha256:3ede3a01ca0e0dc89fb6a539be60d836ff0b2aed724832dc5cefd00d22b5f04e' || 'archlinux:latest@sha256:b0deabeb3d283da2c7f7dbf0eea051b7b2cd0554e0b737cc457fd21683bdcdd1' }}
    steps:
      # pacman 7 downloads as the unprivileged 'alpm' user behind a Landlock
      # ruleset. The arm64 runner's container cannot apply that ruleset
      # ("Operation not permitted"), so every pacman call fails before it
      # syncs. Disabling it in pacman.conf rather than passing
      # --disable-sandbox, because makepkg -s invokes pacman itself and would
      # not inherit the flag. Scoped to this leg: the x86_64 container applies
      # the ruleset fine and keeps the sandbox.
      - name: Disable pacman's download sandbox (aarch64 container)
        if: matrix.arch == 'aarch64'
        run: |
          # DisableSandbox is an [options] directive, so it has to go inside
          # that section. Appending to the end of the file puts it in whatever
          # repo section happens to be last ([aur] in this image), where
          # pacman ignores it with only a warning.
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          # pacman-conf resolves the effective configuration, so this fails if
          # the directive landed in the wrong section rather than passing on a
          # grep of the raw file.
          pacman-conf DisableSandbox

      - name: Install build tooling
        run: >-
          pacman -Syu --noconfirm --needed base-devel git sudo namcap
          github-cli pacman-contrib curl gnupg

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Configure trusted extra pacman repos
        if: inputs.extra-repos != ''
        env:
          EXTRA_REPOS: ${{ inputs.extra-repos }}
          KEY_FINGERPRINT: ${{ inputs.extra-repo-key-fingerprint }}
          KEY_URL: ${{ inputs.extra-repo-key-url }}
        run: |
          if [ -z "$KEY_URL" ] || [ -z "$KEY_FINGERPRINT" ]; then
            echo "::error::extra-repos requires a signing key URL and fingerprint"
            exit 1
          fi
          curl -fsSLo /tmp/extra-repo.asc "$KEY_URL"
          actual=$(gpg --show-keys --with-colons /tmp/extra-repo.asc |
            awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$actual" != "$KEY_FINGERPRINT" ]; then
            echo "::error::extra repository key fingerprint mismatch"
            exit 1
          fi
          pacman-key --init
          pacman-key --add /tmp/extra-repo.asc
          pacman-key --lsign-key "$KEY_FINGERPRINT"
          printf '%s\n' "$EXTRA_REPOS" >> /etc/pacman.conf
          # The repository is appended after the base system upgrade above,
          # so its database is not present yet.  Synchronize before makepkg
          # asks pacman to resolve dependencies from the newly trusted repo.
          pacman -Sy --noconfirm

      - name: Trust the checkout (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Version consistency gate (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkgver=$(sed -n 's/^pkgver=//p' "${{ inputs.pkgbuild-dir }}/PKGBUILD")
          pkgrel=$(sed -n 's/^pkgrel=//p' "${{ inputs.pkgbuild-dir }}/PKGBUILD")
          # Packaging-only rebuilds (e.g. overskride) keep upstream pkgver and
          # tag v$pkgver-$pkgrel so a second release does not move v$pkgver.
          if [ "$tag" != "$pkgver" ] && [ "$tag" != "${pkgver}-${pkgrel}" ]; then
            echo "::error::tag v$tag does not match PKGBUILD pkgver=$pkgver (or pkgver-pkgrel $pkgver-$pkgrel)"
            exit 1
          fi
          if [ -f Cargo.toml ]; then
            cargo_ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            if [ -n "$cargo_ver" ] && [ "$cargo_ver" != "$pkgver" ]; then
              echo "::error::Cargo.toml version $cargo_ver does not match PKGBUILD pkgver=$pkgver"
              exit 1
            fi
          fi

      - name: Source integrity policy
        run: |
          if grep -Eq "^[[:space:]]*[[:alnum:]]+sums=.*['\"]SKIP['\"]" \
               "${{ inputs.pkgbuild-dir }}/PKGBUILD"; then
            echo "::error::PKGBUILD source checksums may not use SKIP"
            exit 1
          fi

      - name: Prepare unprivileged builder
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"

      # The PKGBUILD's source entry is named $pkgname-$pkgver.tar.gz; providing
      # the file locally makes makepkg skip the download. Tag builds need this
      # too: the PKGBUILD lives inside the GitHub archive it checksums, so a
      # committed sha256 cannot match that same tag's auto-archive.
      - name: Snapshot source tarball from HEAD
        if: ${{ !inputs.skip-head-snapshot }}
        run: |
          cd "${{ inputs.pkgbuild-dir }}"
          # Split packages: source tarball is named after pkgbase; scalar
          # single-package repos have no pkgbase= line, fall back to pkgname=.
          pkgbase=$(sed -n 's/^pkgbase=//p' PKGBUILD)
          [ -n "$pkgbase" ] || pkgbase=$(sed -n 's/^pkgname=//p' PKGBUILD)
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz \
            --prefix "$pkgbase-$pkgver/" -o "$PWD/$pkgbase-$pkgver.tar.gz" HEAD
          chown builder: "$PWD/$pkgbase-$pkgver.tar.gz" PKGBUILD
          # The committed checksum authenticates the immutable release archive.
          # Branch builds use a temporary HEAD snapshot, so update only the
          # runner's working copy before exercising the package build.
          # updpkgsums wraps makepkg, which refuses to run as root.
          su builder -c 'updpkgsums'

      - name: Build package
        run: |
          cd "${{ inputs.pkgbuild-dir }}"
          su builder -c 'makepkg -s --noconfirm'

      - name: namcap (informational)
        run: namcap "${{ inputs.pkgbuild-dir }}"/*.pkg.tar.zst || true

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: arch-package-${{ matrix.arch }}
          path: ${{ inputs.pkgbuild-dir }}/*.pkg.tar.zst

      - name: Upload to GitHub Release
        if: inputs.publish && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" "${{ inputs.pkgbuild-dir }}"/*.pkg.tar.zst --clobber
